# Sulla dashboard vhost.
# - SPA fallback (try_files) so React Router routes don't 404 on reload
# - /api/ proxy to the FastAPI backend
# - /ws WebSocket upgrade proxy for the live dashboard tick stream
#
# `sulla-api` is the docker-compose service name; container DNS on the shared
# network resolves it to the api container's internal IP.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's embedded DNS so nginx re-resolves `sulla-api` on each
    # request instead of caching the IP at startup. Without this, every
    # rebuild of sulla-api hands out a new bridge-network IP and nginx keeps
    # slamming the dead old one → 502 Bad Gateway until -web restarts.
    # The `set $upstream` + variable in `proxy_pass` below is what triggers
    # the re-resolve; without the variable, nginx silently goes back to
    # caching at config-load time.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # gzip text assets — same JS/CSS bundle, smaller wire transfer.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # SPA: any unknown path falls back to index.html so the React Router can
    # take over. Static assets in /assets/ hit the filesystem first.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset cache — Vite hashes filenames, so far-future caching is safe.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        set $upstream_api http://sulla-api:8002;
        proxy_pass $upstream_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /ws {
        set $upstream_ws http://sulla-api:8002;
        proxy_pass $upstream_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # WebSocket connections live longer than HTTP — extend timeouts so the
        # 5-second tick stream isn't killed mid-flight.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
