<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 54" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#93C5FD"/>
      <stop offset="55%"  stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Foundation · Ionic — Ionic column capital -->
  <!-- Abacus -->
  <rect x="2"  y="3"  width="50" height="3"  fill="url(#g)"/>
  <!-- Volute connecting band -->
  <rect x="10" y="6"  width="34" height="12" fill="url(#g)"/>
  <!-- Left volute -->
  <circle cx="10" cy="12" r="9" fill="url(#g)"/>
  <circle cx="10" cy="12" r="5" fill="none" stroke="#1D4ED8" stroke-width="2"/>
  <circle cx="10" cy="12" r="2" fill="url(#g)"/>
  <!-- Right volute -->
  <circle cx="44" cy="12" r="9" fill="url(#g)"/>
  <circle cx="44" cy="12" r="5" fill="none" stroke="#1D4ED8" stroke-width="2"/>
  <circle cx="44" cy="12" r="2" fill="url(#g)"/>
  <!-- Egg-and-dart band -->
  <rect x="13" y="20" width="28" height="2.5" fill="#1D4ED8" opacity="0.65"/>
  <!-- Necking -->
  <rect x="19" y="24" width="16" height="3"  fill="#1D4ED8"/>
  <!-- Shaft -->
  <rect x="17" y="27" width="20" height="23" fill="url(#g)"/>
  <!-- Fluting -->
  <line x1="20" y1="27" x2="20" y2="50" stroke="#1D4ED8" stroke-width="1" opacity="0.55"/>
  <line x1="24" y1="27" x2="24" y2="50" stroke="#1D4ED8" stroke-width="1" opacity="0.55"/>
  <line x1="27" y1="27" x2="27" y2="50" stroke="#1D4ED8" stroke-width="1" opacity="0.55"/>
  <line x1="30" y1="27" x2="30" y2="50" stroke="#1D4ED8" stroke-width="1" opacity="0.55"/>
  <line x1="34" y1="27" x2="34" y2="50" stroke="#1D4ED8" stroke-width="1" opacity="0.55"/>
</svg>
