# Ionic — three-container stack.
#
# Run from the swarm root (~/swarm/), which `include:`s this file alongside
# Anton, Tiberius, Milton, and Fixit. Running compose from ~/swarm/ionic/repo/
# directly creates a different compose project that collides with the
# swarm-managed container_name declarations — don't do it.
#
# Host prereqs (one-time):
#   1. mkdir -p ~/swarm/ionic/data
#   2. cp /path/to/Config.yaml ~/swarm/ionic/data/Config.yaml
#   3. Create ~/swarm/ionic/.env with the runtime secrets (Oanda token + account,
#      Telegram, JWT, bcrypt password hashes)

services:

  # ─── Trading daemon + Telegram bot ───────────────────────────────────────
  ionic-engine:
    build:
      context: .
      dockerfile: Dockerfile
      target: engine
    image: ionic-engine:latest
    container_name: ionic-engine
    restart: unless-stopped
    init: true                          # docker injects tini as PID 1
    env_file:
      - ${IONIC_ENV_FILE:-./.env}       # secrets — never committed
    environment:
      AGENT_NAME:         ionic
      SQLITE_PATH:        /app/data/ionic.db
      CONFIG_PATH:        /app/data/Config.yaml
      RESTART_FLAG_PATH:  /app/data/.restart_engine
      HEARTBEAT_PATH:     /app/data/.engine_heartbeat
      LMSTUDIO_BASE_URL:  ${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      PYTHONUNBUFFERED:   "1"
      # PYTHONPATH lets `from shared.X` resolve the bind-mounted shared lib
      # at /app/shared — see foundation/shared/ on host.
      PYTHONPATH:         "/app"
      TZ:                 ${TZ:-America/Denver}
    volumes:
      # SQLite + Config.yaml + restart flag + heartbeat all live in one
      # shared mount so the API container can see them too. Config.yaml
      # being on the bind mount means edits survive image rebuilds.
      - ${IONIC_DATA_DIR:-./data}:/app/data
      # Foundation shared library (auth / broker_crypto / api routers).
      - ${FOUNDATION_SHARED_DIR:-/home/blisske/swarm/foundation/shared}:/app/shared:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ionic-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── FastAPI dashboard backend ───────────────────────────────────────────
  ionic-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    image: ionic-api:latest
    container_name: ionic-api
    restart: unless-stopped
    init: true
    env_file:
      - ${IONIC_ENV_FILE:-./.env}
    environment:
      AGENT_NAME:         ionic
      AGENT_HOST:         "0.0.0.0"
      AGENT_PORT:         "8002"
      SQLITE_PATH:        /app/data/ionic.db
      DEMO_SQLITE_PATH:   /app/core/demo_data.db    # baked into image
      # Multi-tenant auth + broker_keys + market_states live in the shared
      # Foundation identity DB at ~/swarm/foundation/data/global.db. Same
      # file Corinthian + Doric use — one signup, all bots accessible.
      GLOBAL_DB_PATH:     /app/foundation/global.db
      CONFIG_PATH:        /app/data/Config.yaml
      RESTART_FLAG_PATH:  /app/data/.restart_engine
      LMSTUDIO_BASE_URL:  ${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      CORS_ORIGINS:       ${IONIC_CORS_ORIGINS:-http://localhost,http://192.168.0.135,https://ionic.foundationbots.com,https://ionic.blisske.hopto.org,https://sulla.blisske.hopto.org}
      PYTHONUNBUFFERED:   "1"
      PYTHONPATH:         "/app"
      TZ:                 ${TZ:-America/Denver}
    volumes:
      - ${IONIC_DATA_DIR:-./data}:/app/data
      # Shared cross-bot identity DB — see GLOBAL_DB_PATH above
      - ${FOUNDATION_DATA_DIR:-/home/blisske/swarm/foundation/data}:/app/foundation
      # Foundation shared library (see engine block for rationale)
      - ${FOUNDATION_SHARED_DIR:-/home/blisske/swarm/foundation/shared}:/app/shared:ro
    ports:
      # Loopback-only publish — the API isn't reachable from the LAN
      # (Traefik fronts the web container, which proxies to API internally).
      # Kept for host-side debugging: `curl http://127.0.0.1:8002/api/health`.
      - "127.0.0.1:8002:8002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ionic-net
    depends_on:
      - ionic-engine
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── React SPA + nginx (proxies /api and /ws to ionic-api) ───────────────
  ionic-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: ionic-web:latest
    container_name: ionic-web
    restart: unless-stopped
    init: true
    # During the swarm-edge migration, Traefik (in the swarm-root compose)
    # is the canonical ingress via swarm-net + the labels below. Until the
    # router port-forward is flipped and TLS is verified, the 8085 publish
    # below keeps the dashboard reachable on the LAN at http://<host>:8085
    # for debugging. (8084 is fixit-api's; skipped.) Remove this `ports:`
    # block once Traefik fully fronts.
    ports:
      - "8085:80"
    networks:
      - ionic-net          # private: lets web reach ionic-api by service DNS
      - swarm-net          # shared: lets Traefik route inbound traffic to web
    depends_on:
      - ionic-api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      # Belt-and-braces — the canonical routing comes from the file provider
      # at ~/swarm/proxy/dynamic/ionic.yml, but these labels make the same
      # route discoverable if the provider model changes later.
      - "traefik.enable=true"
      - "traefik.docker.network=swarm-net"
      - "traefik.http.routers.ionic.rule=Host(`${IONIC_HOSTNAME:-ionic.blisske.hopto.org}`)"
      - "traefik.http.routers.ionic.entrypoints=websecure"
      - "traefik.http.routers.ionic.tls=true"
      - "traefik.http.routers.ionic.tls.certresolver=letsencrypt"
      - "traefik.http.services.ionic.loadbalancer.server.port=80"

networks:
  ionic-net:
    driver: bridge
  # External: created once at the swarm level via `docker network create
  # swarm-net`. Shared by Traefik + each bot's *-web container so Traefik
  # can reach them by container DNS without exposing them on the host.
  swarm-net:
    external: true
