ai_agent:
  identity_file: "IDENTITY.md"
  soul_file: "SOUL.md"
  user_file: "USER.md"
  sentiment_analysis:
    api_base: "http://host.docker.internal:1234/v1"
    enabled: true
    model_id: "gemma-4-26b-a4b-it"
    provider: "lmstudio"
    search_enabled: true
    strict_mode: true
    timeout: 30

# ── Broker (Phase 2) ─────────────────────────────────────────────────────────
# Oanda v20 REST API. Practice account is free + unlimited; live account is
# paid + funded. Token + account ID + environment all come from the .env file.
# Ionic deliberately trades unleveraged (1:1 sizing) — see Risk section.
oanda:
  shadow_mode: true   # No real Oanda orders. Engine logs paper trades to DB.
  environment: practice   # "practice" or "live"; .env's OANDA_ENVIRONMENT wins.

consensus:
  min_consensus_score: 3    # primary(1) + 2 of 3 supporting signals minimum (was 2 — comment/value mismatch fixed 2026-05-17)
  bearish_abort: true        # hard stop on BEARISH verdict, logged to DB
  llm_reasoning: true        # thinking mode on by default
  log_reasoning: false       # store <think> block to DB (enable when Qwen3 arrives)

# ── Macro-event blackout (Phase 4) ──────────────────────────────────────────
# Skips new entries on a pair when ANY currency in it (base or quote) has a
# high-impact macro event within the configured window. Source: ForexFactory
# weekly JSON feed, refreshed every 30 min. Fails open if the feed is down.
#
# importance_min options: "Low" (everything), "Medium" (most central-bank
# speak + secondary data), "High" (NFP, CPI, FOMC, rate decisions only).
# "High" is the right default — wider filters block ~half the trading week.
macro_blackout:
  enabled: true
  minutes_before: 60        # block entries this many minutes before a high-impact event
  minutes_after:  120       # ... and after (let initial volatility settle)
  importance_min: High

# ── Multi-timeframe regime filter ───────────────────────────────────────────
# TREND FOLLOWING and VOLATILITY BREAKOUT entries additionally require the
# pair's daily trend (EMA9 vs EMA21) to be BULL. Mean Reversion and Liquidity
# Sweep are exempt — counter-trend by design. Daily fetch cached per-day.
mtf_filter:
  enabled: true

# ── Pyramiding ──────────────────────────────────────────────────────────────
# Adds legs to TF and VB positions only. MR / LS are excluded — pyramiding
# into a counter-trend paradigm doubles down against its own thesis.
# DEFAULT OFF. Flip after first trend trade fires and single-leg mechanics
# are observed working end-to-end.
pyramiding:
  enabled: false
  trigger_atr_mult: 1.0
  size_decay: 0.5
  max_legs:
    trend_following: 3
    volatility_breakout: 2

# ── Correlation-aware sizing ────────────────────────────────────────────────
# FX majors share huge correlation through their USD leg. Owning three
# USD-leg longs (EUR/USD, GBP/USD, AUD/USD) is functionally one big short-USD
# bet. Buckets group pairs that move together so we don't accidentally lever
# up macro exposure.
correlation_aware_sizing:
  enabled: true
  curve: [1.0, 0.85, 0.70, 0.55, 0.40]
  sectors:
    USD_short:    [EUR/USD, GBP/USD, AUD/USD, NZD/USD]   # buying foreign vs USD
    USD_long:     [USD/JPY, USD/CHF, USD/CAD]            # buying USD vs foreign
    Risk_on:      [AUD/USD, NZD/USD]                     # commodity / carry
    Risk_off:     [USD/JPY, USD/CHF]                     # safe-haven flow

tuning:
  enabled: true
  min_trades_to_tune: 10
  shadow_trades_required: 10
  max_params_per_run: 2
  cooling_off_hours: 48
  metric: profit_factor
  min_metric_improvement: 0.05
  param_bounds:
    rsi_entry: {min: 20, max: 65, max_step: 5}
    bbw_threshold: {min: 0.03, max: 0.20, max_step: 0.01}
    initial_stop_mult: {min: 1.0, max: 3.5, max_step: 0.1}
    trailing_stop_mult: {min: 1.5, max: 4.0, max_step: 0.1}
    adx_trend_threshold: {min: 18, max: 40, max_step: 2}
    position_size_max_pct: {min: 1.0, max: 15.0, max_step: 1.0}

ratchet:
  atr_period: 14
  initial_stop_mult: 2.0
  trailing_stop_mult: 2.5
  # FX equivalent of Anton's Power Hour defense: widen trailing stops
  # during the London/NY overlap (08:00-12:00 ET), FX's highest-vol window.
  # Wired into config_manager.get_ratchet_multiplier 2026-05-18.
  power_hour_defense:
    enabled: true
    atr_buffer: 0.3            # FX moves are less violent than equity closes; 0.3 conservative
    start_hour_et: 8           # London/NY overlap start
    end_hour_et: 12            # London/NY overlap end (exclusive)

risk:
  initial_capital: 10000.0      # Shadow ledger starting balance ($10K to mirror Anton/Tiberius scale)
  min_trade_size_usd: 12.0
  risk_per_trade_pct: 5.0       # Paper default. Lower to 2.0 before flipping to Oanda live ⚠️
  position_size_max_pct: 12.0   # Hard cap on notional per position as % of equity
  # ── Tiered drawdown ──────────────────────────────────────────────────────
  drawdown_alert_pct: 8.0       # Telegram warning, no behavior change
  drawdown_derisk_pct: 15.0     # Position sizing × derisk_size_multiplier
  drawdown_halt_pct: 25.0       # Autonomous loop halts; manual /resume required
  drawdown_recovery_pct: 10.0   # Drawdown must shrink below this to exit DERISK
  derisk_size_multiplier: 0.5

strategy:
  # ── Indicator periods (asset-class-agnostic; tuner can adjust) ───────────
  adx_trend_threshold: 30
  adx_range_threshold: 20
  autonomous_mode: true
  ema_fast: 9
  ema_slow: 21
  max_open_trades: 5
  rsi_period: 14
  timeframe: 1h                # FX moves slower than crypto; 1h is the natural cadence
  update_interval_min: 5

  # ── FX universe ──────────────────────────────────────────────────────────
  # Standard 7 majors. Hot-reloaded every cycle — edit + save here (or via the
  # Config page) and the next scan picks up the change. No restart needed.
  active_symbols:
    # USD-leg pairs (foreign as base)
    - EUR/USD
    - GBP/USD
    - AUD/USD
    - NZD/USD
    # USD-leg pairs (USD as base)
    - USD/JPY
    - USD/CHF
    - USD/CAD

  # ── Paradigm-specific RSI entry thresholds ───────────────────────────────
  paradigms:
    liquidity_sweep:
      rsi_entry: 40
    mean_reversion:
      rsi_entry: 30
    trend_following:
      rsi_entry: 45
    volatility_breakout:
      bbw_threshold: 0.08
      rsi_entry: 65

  # ── Per-symbol overrides ─────────────────────────────────────────────────
  # JPY pairs trade at much larger nominal values than other majors so their
  # ATR is bigger in absolute terms — multipliers don't need adjusting, but
  # the pip-value calculation does (Phase 3 handles this).
  # Start empty; tuner will populate as it learns each pair's behavior.
  symbol_overrides: {}

# ── Phase notes (informational; not read by the engine) ─────────────────────
# Phase 4 brings:
#   - macro_blackout: calendar of NFP / FOMC / CPI / ECB / BoJ events; new
#     entries skipped within blackout_minutes_before/after
#   - friday_close: optional auto-flatten at e.g. 16:00 ET Friday to avoid
#     weekend gap risk over the FX close
